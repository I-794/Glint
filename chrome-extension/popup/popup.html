<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="dot"></span>
      <strong>Glint</strong> Capture
    </div>
  </header>

  <div class="modes">
    <button class="mode" data-mode="visible">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
      <span class="label">Visible area</span>
      <span class="sub">What's on screen now</span>
    </button>
    <button class="mode" data-mode="fullpage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      <span class="label">Full page</span>
      <span class="sub">The whole scrolling page</span>
    </button>
    <button class="mode" data-mode="region">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
      <span class="label">Select region</span>
      <span class="sub">Drag a box to capture</span>
    </button>
  </div>

  <p class="status" id="status">Opens a quick editor. Full studio one click away.</p>
  <script src="popup.js"></script>
</body>
</html>
